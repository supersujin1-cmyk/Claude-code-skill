[project]
name = "ledger"
version = "0.1.0"
description = "개인 가계부: 카드, 통장, 증권(국내/해외) 내역 통합"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "msoffcrypto-tool>=5.4",
    "supabase>=2.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
